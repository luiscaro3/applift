name: Publish AppLift to Tessl

# Push registers/checks the workflow; publishing requires manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/tessl-publish.yml]

permissions:
  contents: read

concurrency:
  group: tessl-publish
  cancel-in-progress: false

jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Confirm manual publishing boundary
        run: echo 'Workflow registered. Publishing requires workflow_dispatch on master.'
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: "0.117.0"
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Validate plugin
        run: tessl plugin lint .
      - name: Verify packaged skill and references
        run: |
          tessl plugin pack . --output "$RUNNER_TEMP/applift-specs.tgz"
          python3 - "$RUNNER_TEMP/applift-specs.tgz" <<'PY'
          import sys, tarfile
          required = {
              'SKILL.md', 'LICENSE', 'BRIDGE-PLAN.md', 'MODELS.md',
              'specs/identity.md', 'specs/ownership.md',
              'specs/connections.md', 'specs/background-work.md',
              'specs/subscriptions.md', 'specs/management.md',
              'examples/personal-mailbox-app.md', 'examples/paid-personal-app.md',
          }
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              files = {m.name.removeprefix('./').removeprefix('package/')
                       for m in archive.getmembers() if m.isfile()}
          missing = required - files
          if missing:
              raise SystemExit('Missing packaged resources: ' + ', '.join(sorted(missing)))
          print('Verified all 12 required skill resources in archive')
          PY
      - name: Check publication without publishing
        run: tessl plugin publish . --dry-run --skip-evals --workspace ws-01a163a1584877afbb3893e6c7dafc5e
      - name: Publish public plugin and link repository
        run: tessl plugin publish . --skip-evals --workspace ws-01a163a1584877afbb3893e6c7dafc5e
