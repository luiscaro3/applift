name: Publish AppLift to Tessl

# Publish only trusted merged source or an explicit manual run on master.
on:
  workflow_dispatch:
  pull_request_target:
    types: [closed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tessl-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Never check out an unmerged PR head with the publishing secret.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          version: "0.117.0"
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Stage reviewable skill resources
        run: python3 scripts/stage_tessl_skill.py "$RUNNER_TEMP/applift-specs"
      - name: Validate plugin
        run: tessl plugin lint "$RUNNER_TEMP/applift-specs"
      - name: Verify packaged skill and references
        run: |
          tessl plugin pack "$RUNNER_TEMP/applift-specs" --output "$RUNNER_TEMP/applift-specs.tgz"
          python3 scripts/check_skill_bundle.py "$RUNNER_TEMP/applift-specs.tgz" --review-scope
          python3 - "$RUNNER_TEMP/applift-specs.tgz" <<'PY'
          import sys, tarfile
          required = {
              'SKILL.md', 'LICENSE', 'references/BRIDGE-PLAN.md', 'references/MODELS.md',
              'references/identity.md', 'references/ownership.md',
              'references/connections.md', 'references/background-work.md',
              'references/subscriptions.md', 'references/management.md',
              'references/user-choices.md',
              'references/credits.md',
              'references/lifecycle.md',
              'references/personal-mailbox-app.md', 'references/paid-personal-app.md',
          }
          with tarfile.open(sys.argv[1], 'r:gz') as archive:
              files = {m.name.removeprefix('./').removeprefix('package/')
                       for m in archive.getmembers() if m.isfile()}
          missing = required - files
          if missing:
              raise SystemExit('Missing packaged resources: ' + ', '.join(sorted(missing)))
          print(f'Verified all {len(required)} required skill resources in archive')
          PY
      - name: Check publication without publishing
        run: tessl plugin publish "$RUNNER_TEMP/applift-specs" --dry-run --bump patch --skip-evals --workspace ws-01a163a1584877afbb3893e6c7dafc5e
      - name: Publish public plugin and link repository
        run: tessl plugin publish "$RUNNER_TEMP/applift-specs" --bump patch --skip-evals --workspace ws-01a163a1584877afbb3893e6c7dafc5e
